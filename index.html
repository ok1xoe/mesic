<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <title>Měsíční vozítko</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <canvas id="screen" width="256" height="192"></canvas>

    <div id="touch" aria-label="Dotykové ovládání">
        <div class="row">
            <button data-act="left" aria-label="Vlevo">◀</button>
            <button data-act="right" aria-label="Vpravo">▶</button>
            <button data-act="up" class="jump" aria-label="Skok a trysky">▲</button>
            <button data-act="down" aria-label="Dolů">▼</button>
        </div>
        <div class="row">
            <button data-act="fire" class="fire" aria-label="Střelba vpřed">VPŘED</button>
            <button data-act="back" class="fire" aria-label="Střelba dozadu">ZPĚT</button>
            <button data-act="act" aria-label="Vystoupit nebo nastoupit">E/V</button>
            <button data-act="pause" aria-label="Pauza">❚❚</button>
        </div>
    </div>

    <script src="js/sprites.js"></script>
    <script src="js/font.js"></script>
    <script src="js/gfx.js"></script>
    <script src="js/sound.js"></script>
    <script src="js/game.js"></script>
    <script src="js/render.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
